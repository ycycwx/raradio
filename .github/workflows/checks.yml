name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      check_mlx:
        description: Install locked MLX packages on Apple Silicon (no model download)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
      - name: Install core from the committed lockfile
        run: |
          uv lock --check
          sh setup.sh core
          uv pip check
      - name: Standard-library tests (no models or optional dependencies)
        run: .venv/bin/python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Shell syntax
        run: sh -n setup.sh run.sh

  mlx-install:
    name: Optional MLX package installation (no models)
    if: github.event_name == 'workflow_dispatch' && inputs.check_mlx
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.1"
          python-version: "3.11"
      - name: Install optional packages and check dependency consistency
        run: |
          sh setup.sh mlx
          uv pip check
      # Hosted VMs are not a substitute for a real Metal/model/voice-quality test.
