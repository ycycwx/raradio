name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      check_mlx:
        description: Run only the MLX package installation check on Apple Silicon (no models)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }}, Python ${{ matrix.python }})
    if: github.event_name != 'workflow_dispatch' || !inputs.check_mlx
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout || 10 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.11–3.14"
            timeout: 40
            versions: |-
              3.11
              3.12
              3.13
              3.14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.versions || matrix.python }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
      - name: Check the locked core environment and run model-free tests
        env:
          PYTHON_VERSIONS: ${{ matrix.versions || matrix.python }}
        run: |
          result=0
          for version in $PYTHON_VERSIONS; do
            echo "::group::Core checks for Python $version"
            if ! UV_PYTHON="$version" sh .github/scripts/check-core.sh; then
              echo "::error::Core checks failed for Python $version"
              result=1
            fi
            echo "::endgroup::"
          done
          exit "$result"

  mlx-install:
    name: Optional MLX package installation (no models)
    if: github.event_name == 'workflow_dispatch' && inputs.check_mlx
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.10"
          python-version: "3.11"
      - name: Install optional packages and check dependency consistency
        run: |
          sh setup.sh mlx
          uv pip check
      # Hosted VMs are not a substitute for a real Metal/model/voice-quality test.
